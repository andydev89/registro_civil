name: Insert Commits into PR Description

on:
  pull_request:
    types: [opened, edited]

jobs:
  update-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get Pull Request Number
        id: pr_number
        run: echo "::set-output name=number::$(echo $GITHUB_REF | sed 's|.*/||')"

      - name: Get Latest Commit Messages
        id: commit_messages
        run: |
          git log --pretty=format:"%s" HEAD...$(echo $GITHUB_REF | sed 's|.*/||') > commit_messages.txt
          echo "::set-output name=messages::$(cat commit_messages.txt)"

      - name: Update PR Description
        uses: peter-evans/create-pull-request@v3.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update PR Description"
          branch: update-pr-description-${{ steps.pr_number.outputs.number }}
          title: "Update PR Description"
          body: |
            Commits:
            ${{ steps.commit_messages.outputs.messages }}
          base: ${{ github.head_ref }}
