name: Insert Commits into PR Description

on:
  pull_request:
    types: [opened, edited]

jobs:
  update-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get Pull Request Number
        id: pr_number
        run: echo "::set-output name=number::$(echo $GITHUB_REF | sed 's|.*/||')"

      - name: Get Latest Commit Messages
        id: commit_messages
        run: |
          git log --pretty=format:"%s" HEAD...$(echo $GITHUB_REF | sed 's|.*/||') > commit_messages.txt
          echo "::set-output name=messages::$(cat commit_messages.txt)"

      - name: Update PR Description
        run: |
          sed -i "s|<!-- COMMIT_LIST -->|<details><summary>Commits</summary>\n\n${{ steps.commit_messages.outputs.messages }}\n</details>|" $GITHUB_EVENT_PATH
          jq . $GITHUB_EVENT_PATH > $GITHUB_EVENT_PATH.tmp && mv $GITHUB_EVENT_PATH.tmp $GITHUB_EVENT_PATH

      - name: Commit and Push Changes
        uses: EndBug/add-and-commit@v7
        with:
          message: 'Update PR Description'
          add: $GITHUB_EVENT_PATH
          push: 'true'
          # push-via-ssh: 'false'
          # ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}


